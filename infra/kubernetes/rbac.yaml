apiVersion: v1
kind: Namespace
metadata:
  name: incident-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: commander-reads
  namespace: incident-lab
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: commander-actions
  namespace: incident-lab
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: commander-reads
  namespace: incident-lab
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [demo-api, demo-worker]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: commander-actions
  namespace: incident-lab
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [demo-api, demo-worker]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [demo-worker]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: commander-reads
  namespace: incident-lab
subjects:
  - kind: ServiceAccount
    name: commander-reads
    namespace: incident-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: commander-reads
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: commander-actions
  namespace: incident-lab
subjects:
  - kind: ServiceAccount
    name: commander-actions
    namespace: incident-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: commander-actions
