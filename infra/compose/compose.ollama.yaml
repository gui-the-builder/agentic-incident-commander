# Enabled by the operator CLI when OLLAMA_RUNTIME=container.
services:
  ollama:
    image: ollama/ollama:0.33.3
    profiles: [llm]
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama-data:/root/.ollama
    networks: [lab]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      retries: 30
  agent-runtime:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama: {condition: service_healthy}
volumes:
  ollama-data:
