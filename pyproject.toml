[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentic-incident-commander"
version = "0.1.0"
description = "Local-first, evidence-driven incident response lab"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0.39,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "httpx>=0.28,<1",
  "langgraph>=1,<2",
  "langchain-core>=1,<2",
  "prometheus-client>=0.21,<1",
  "opentelemetry-sdk>=1.31,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.31,<2",
  "opentelemetry-instrumentation-fastapi>=0.52b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.52b0,<1",
  "pyyaml>=6,<7",
  "python-dotenv>=1,<2",
  "mcp>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6"]

[tool.hatch.build.targets.wheel]
packages = ["packages/commander"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["commander", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["commander"]
mypy_path = "packages"
